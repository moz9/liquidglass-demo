  <title>Liquid Glass — библиотека примеров</title>

  <style>
    * { box-sizing: border-box; }
    html { height: 100%; background: #f5f6f8; color: #172332; font: 15px/1.4 system-ui, sans-serif; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: 0 0 auto; min-width: 0; padding: 12px 20px 0; background: #fff; border-bottom: 1px solid #dbe1e8; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .title-row { display: flex; align-items: center; gap: 4px; }
    #effectSupport { flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #536273; font-size: 22px; }
    #effectSupport:hover { background: #eef2f7; }
    dialog { width: min(520px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 24px; border: 1px solid #ccd5e0; border-radius: 22px; background: #fff; color: #172332; overflow: auto; }
    dialog::backdrop { background: rgb(15 25 40 / .4); }
    dialog h2 { font-size: 22px; margin: 0 0 16px; }
    dialog p { font-size: 14px; margin: 12px 0; }
    dialog form { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    dialog button { min-height: 44px; padding: 8px 14px; border: 1px solid #ccd5e0; border-radius: 12px; background: #fff; color: inherit; }
    dialog textarea { display: block; width: 100%; height: 160px; margin: 14px 0; padding: 12px; border: 1px solid #ccd5e0; border-radius: 12px; font: 12px/1.5 ui-monospace, monospace; color: #172332; background: #f5f6f8; }
    dialog :is(a, textarea):focus-visible { outline: 3px solid #1473e6; outline-offset: 2px; }
    @media (forced-colors: active) { dialog, dialog button, dialog textarea { background: Canvas; color: CanvasText; border-color: CanvasText; } }

    h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.035em; }
    p { margin: 4px 0 8px; color: #536273; font-size: 12px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #1473e6; outline-offset: -3px; }
    #downloadShowcase { flex: 0 0 auto; min-height: 44px; padding: 8px 13px; border: 1px solid #ccd5e0; border-radius: 12px; background: #fff; color: inherit; font-size: 13px; }
    nav { min-width: 0; overflow-x: auto; scrollbar-width: thin; overscroll-behavior-x: contain; }
    #showcaseTabs { display: flex; width: max-content; min-width: 100%; gap: 4px; }
    [role="tab"] { flex: 1 0 auto; min-height: 48px; min-width: 44px; padding: 10px 16px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #536273; }
    [role="tab"][aria-selected="true"] { border-bottom-color: #1473e6; color: #125eaf; font-weight: 650; }
    main { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; }
    iframe { display: block; flex: 1 1 auto; width: 100%; height: 100%; min-width: 0; min-height: 0; border: 0; background: #f5f6f8; }
    @media (max-width: 480px) { header { padding: 10px 12px 0; } .heading { gap: 10px; } h1 { font-size: 20px; } [role="tab"] { padding-inline: 13px; } }
    @media (forced-colors: active) { [role="tab"][aria-selected="true"] { border-bottom-color: Highlight; color: LinkText; } }
  </style>

gn-items: center; justify-content: center; }\n    .stage--stripes { background: repeating-linear-gradient(-45deg, #ffcf5c 0 18px, #ff7a59 18px 36px, #7c5cff 36px 54px, #2ec4ff 54px 72px); }\n    .stage--photo { color: #fff; background:\n        radial-gradient(50% 70% at 25% 40%, #ffb86b, transparent 70%),\n        radial-gradient(40% 60% at 75% 60%, #ff4d8d, transparent 70%),\n        linear-gradient(160deg, #3a1c71, #d76d77 55%, #ffaf7b); }\n    .stage--text { background: #fff; color: #111; align-items: flex-start; justify-content: flex-start; }\n    html[data-theme=\"dark\"] .stage--text { background: #1c1c1e; color: #eee; }\n    .stage__bgtext { position: absolute; inset: 20px; font: 500 15px/1.6 Georgia, serif; opacity: 0.85; pointer-events: none; }\n    .stage__row { position: relative; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; width: 100%; }\n    .controls { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 28px; }\n    .control-card { padding: 22px; border-radius: 24px; background: rgb(255 255 255 / 0.7); display: grid; gap: 14px; align-content: start; }\n    html[data-theme=\"dark\"] .control-card { background: #1c1c1e; }\n    .control-card h3 { font: 600 15px/1.2 var(--lg-font); opacity: 0.7; }\n    .switch-row { display: flex; align-items: center; justify-content: space-between; font: 400 17px/1 var(--lg-font); }\n\n    /* Optics: a live background under a lens. The grid drifts, so the bending of the\n       lines at the edge is visible; the caption on the glass must stay sharp. */\n    .optics-section { background: #0b1024; color: #fff; }\n    .optics-section .lg-seg { margin-top: 24px; }\n    .optics-section .lg-seg__item { min-width: 128px; white-space: nowrap; }\n    /* Narrow screens: the three labels share the width instead of pushing the page wider. */\n    @media (max-width: 560px) {\n      .optics-section .lg-seg { width: 100%; }\n      .optics-section .lg-seg__item { min-width: 0; padding: 0 6px; font-size: 12px; }\n    }\n    .optics-stage { position: relative; height: 340px; margin-top: 20px; border-radius: 28px; overflow: hidden; }\n    .optics-grid { position: absolute; inset: -60%;\n      background:\n        repeating-linear-gradient(0deg, transparent 0 39px, rgb(255 255 255 / .85) 39px 43px, rgb(20 30 40 / .8) 43px 45px, transparent 45px 64px),\n        repeating-linear-gradient(90deg, transparent 0 59px, rgb(255 255 255 / .7) 59px 63px, rgb(20 30 40 / .7) 63px 64px, transparent 64px 88px),\n        linear-gradient(125deg, #cfdbbc 0 37%, #f0c994 37% 43%, #9acddd 43% 70%, #bdcbaa 70%);\n      animation: optics-drift 18s linear infinite alternate; }\n    @keyframes optics-drift {\n      from { transform: rotate(-18deg) translate3d(-5%, 0, 0); }\n      to { transform: rotate(-18deg) translate3d(5%, 0, 0); }\n    }\n    /* Calibration for this scene; leave library accessibility rules in control. */\n    .optics-tile { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, 86%); height: 152px; border-radius: 34px; display: grid; place-items: center; text-align: center; --lg-blur: 2.5px; --lg-saturate: 1.12; --lg-brightness: 1; --lgv-inner: transparent; }\n    .optics-tile strong { display: block; font: 700 27px/1.15 var(--lg-font); letter-spacing: -0.02em; }\n    .optics-tile span { display: block; font: 500 14px/1.3 var(--lg-font); opacity: 0.82; margin-top: 7px; }\n    .optics-note { margin-top: 16px; font: 400 15px/1.5 var(--lg-font); opacity: 0.82; max-width: 720px; }\n    .optics-pause { margin-top: 16px; padding: 9px 16px; border: 1px solid #8391a9; border-radius: 999px; background: transparent; color: inherit; font: inherit; cursor: pointer; }\n    .optics-pause:focus-visible { outline: 3px solid #79baff; outline-offset: 4px; }\n    .optics-pause:disabled { opacity: .65; cursor: default; }\n\n    .gl-section { background: #0b1024; color: #fff; }\n    .gl-scene { position: relative; height: 460px; margin-top: 28px; border-radius: 28px; overflow: hidden; touch-action: none; cursor: grab; }\n    .gl-stage { display: block; width: 100%; height: 100%; }\n    .gl-solid { position: absolute; inset: 0; overflow: hidden; background: #0b1024; pointer-events: none; }\n    .gl-solid[hidden] { display: none; }\n    .gl-solid::before { content: 'Liquid'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 800 clamp(56px, 15vw, 156px)/1 var(--lg-font); }\n    .gl-solid span { position: absolute; background: #242832; border: 1px solid #949aac; }\n    .gl-status { margin-top: 16px; font: 400 15px/1.5 var(--lg-font); }\n    @media (forced-colors: active) {\n      .gl-solid, .gl-solid span { background: Canvas; color: CanvasText; border-color: CanvasText; }\n      .gl-solid::before { color: CanvasText; }\n    }\n\n    .list { display: grid; gap: 14px; margin-top: 28px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }\n    .card { display: flex; gap: 14px; padding: 14px; border-radius: 22px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); }\n    html[data-theme=\"dark\"] .card { background: #1c1c1e; }\n    .thumb { width: 64px; height: 64px; border-radius: 14px; flex: none; }\n    .card h3 { font: 600 16px/1.3 var(--lg-font); }\n    .card p { font: 400 14px/1.4 var(--lg-font); opacity: 0.65; margin-top: 4px; }\n    .spacer { height: 140px; }\n\n    /* Appearance settings: a settings form is not a glass surface, so the panel is\n       opaque and the only glass inside it is the preview over its own small backdrop. */\n    .settings { position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center; background: rgb(0 0 0 / 0.3); }\n    .settings[hidden] { display: none; }\n    .settings__panel { width: min(520px, calc(100% - 24px)); margin-bottom: max(12px, env(safe-area-inset-bottom)); padding: 20px; border-radius: 26px; background: #f9f9fb; color: #10131a; box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.4); }\n    html[data-theme=\"dark\"] .settings__panel { background: #1a1b1f; color: #f2f2f7; }\n    .settings__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n    .settings__head h2 { font: 700 20px/1.2 var(--lg-font); margin: 0; letter-spacing: -0.01em; }\n    .settings__close { border: 0; background: none; color: inherit; font: 400 26px/1 var(--lg-font); cursor: pointer; padding: 2px 8px; border-radius: 10px; }\n    .settings__label { display: flex; align-items: baseline; justify-content: space-between; margin-top: 20px; font: 600 15px/1 var(--lg-font); }\n    .settings__label output { font-weight: 400; opacity: 0.7; }\n    .settings__ends { display: flex; justify-content: space-between; margin-top: 4px; font: 400 12px/1 var(--lg-font); opacity: 0.65; }\n    .settings input[type=\"range\"] { width: 100%; margin: 12px 0 0; accent-color: #0088ff; }\n    .settings input[type=\"range\"]:disabled { cursor: not-allowed; }\n    .settings__preview { margin-top: 18px; }\n    .preview__stage { position: relative; height: 128px; border-radius: 18px; overflow: hidden; }\n    .preview__bg { position: absolute; inset: -60%;\n      background:\n        repeating-linear-gradient(0deg, transparent 0 27px, rgb(255 255 255 / .85) 27px 30px, rgb(20 30 40 / .8) 30px 32px, transparent 32px 44px),\n        repeating-linear-gradient(90deg, transparent 0 41px, rgb(255 255 255 / .7) 41px 44px, rgb(20 30 40 / .7) 44px 45px, transparent 45px 62px),\n        linear-gradient(125deg, #cfdbbc 0 37%, #f0c994 37% 43%, #9acddd 43% 70%, #bdcbaa 70%);\n      animation: optics-drift 18s linear infinite alternate; }\n    .preview__tile { position: absolute; left: 14px; right: 14px; top: 20px; height: 88px; border-radius: 22px; display: grid; place-items: center; }\n    .preview__tile span { font: 600 14px/1 var(--lg-font); color: #10131a; }\n    .settings__status { margin: 14px 0 0; font: 400 13px/1.45 var(--lg-font); opacity: 0.78; }\n    .settings__actions { margin-top: 16px; display: flex; gap: 10px; }\n    .settings .btn { font: 600 15px/1 var(--lg-font); height: 38px; padding: 0 18px; border-radius: 9999px; border: 1px solid rgb(60 60 67 / 0.26); background: rgb(120 120 128 / 0.14); color: inherit; cursor: pointer; }\n    .settings .btn:disabled { opacity: 0.45; cursor: not-allowed; }\n    .settings .btn:focus-visible, .settings input:focus-visible { outline: 3px solid #1473e6; outline-offset: 3px; }\n\n    @media (prefers-reduced-motion: reduce) {\n      .optics-grid, .preview__bg { animation: none; }\n    }\n    /* The moving backdrop is the point of the optics block, but it must not cost\n       frames while the block is off screen. */\n    .optics-grid, .preview__bg { animation-play-state: paused; }\n    body.optics-live .optics-grid, .settings:not([hidden]) .preview__bg { animation-play-state: running; }\n    body.optics-live .optics-stage[data-paused=\"true\"] .optics-grid { animation-play-state: paused; }\n  \u003c/style>\n  \u003cscript>\n    // Restore the appearance setting before the first paint: no flash of the default density.\n    try {\n      const saved = localStorage.getItem('liquidglass.demo.density');\n      const n = Number(saved);\n      if (saved !== null && saved.trim() !== '' && Number.isFinite(n) && n >= 0 && n \u003c= 100) {\n        document.documentElement.style.setProperty('--lg-density', String(n / 100));\n      }\n    } catch { /* Storage is optional; the live control still works. */ }\n  \u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n    \u003csymbol id=\"i-back\" viewBox=\"0 0 24 24\">\u003cpath d=\"M15 5l-7 7 7 7\" />\u003c/symbol>\n    \u003csymbol id=\"i-home\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 11l9-7 9 7\" />\u003cpath d=\"M5 10v10h14V10\" />\u003c/symbol>\n    \u003csymbol id=\"i-grid\" viewBox=\"0 0 24 24\">\u003crect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"2\" />\u003crect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"2\" />\u003crect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"2\" />\u003crect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"2\" />\u003c/symbol>\n    \u003csymbol id=\"i-heart\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z\" />\u003c/symbol>\n    \u003csymbol id=\"i-user\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\" />\u003cpath d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\" />\u003c/symbol>\n    \u003csymbol id=\"i-search\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\" />\u003cpath d=\"M20 20l-4-4\" />\u003c/symbol>\n    \u003csymbol id=\"i-more\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"5\" cy=\"12\" r=\"1.2\" />\u003ccircle cx=\"12\" cy=\"12\" r=\"1.2\" />\u003ccircle cx=\"19\" cy=\"12\" r=\"1.2\" />\u003c/symbol>\n    \u003csymbol id=\"i-moon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z\" />\u003c/symbol>\n    \u003csymbol id=\"i-plus\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 5v14M5 12h14\" />\u003c/symbol>\n    \u003csymbol id=\"i-share\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3v12\" />\u003cpath d=\"M7 8l5-5 5 5\" />\u003cpath d=\"M5 13v6h14v-6\" />\u003c/symbol>\n    \u003csymbol id=\"i-sliders\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 7h8\" />\u003cpath d=\"M18 7h2\" />\u003ccircle cx=\"15\" cy=\"7\" r=\"2.2\" />\u003cpath d=\"M4 17h2\" />\u003cpath d=\"M12 17h8\" />\u003ccircle cx=\"9\" cy=\"17\" r=\"2.2\" />\u003c/symbol>\n  \u003c/svg>\n\n  \u003c!-- Navigation layer: floating glass islands -->\n  \u003cheader class=\"demo-top\">\n    \u003cbutton class=\"lg lg-btn lg-icon-btn lg-interactive lg-lens\" data-lg-adaptive aria-label=\"Назад\">\u003csvg class=\"i\">\u003cuse href=\"#i-back\" />\u003c/svg>\u003c/button>\n    \u003cdiv class=\"right\">\n      \u003cdiv class=\"lg lg-group lg-lens\" data-lg-adaptive>\n        \u003cspan class=\"lg-item tier-chip\" id=\"tierChip\">T?\u003c/span>\n        \u003cspan class=\"lg-item tier-chip\" id=\"densityChip\">—\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"lg lg-group lg-lens\" data-lg-adaptive>\n        \u003cbutton class=\"lg-item\" id=\"settingsBtn\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"settings\" aria-label=\"Внешний вид\">\u003csvg class=\"i\">\u003cuse href=\"#i-sliders\" />\u003c/svg>\u003c/button>\n        \u003cbutton class=\"lg-item\" id=\"themeBtn\" aria-label=\"Переключить тему\">\u003csvg class=\"i\">\u003cuse href=\"#i-moon\" />\u003c/svg>\u003c/button>\n        \u003cbutton class=\"lg-item\" aria-label=\"Поделиться\">\u003csvg class=\"i\">\u003cuse href=\"#i-share\" />\u003c/svg>\u003c/button>\n        \u003cbutton class=\"lg-item\" id=\"moreBtn\" aria-haspopup=\"menu\" aria-expanded=\"false\" aria-controls=\"moreMenu\" aria-label=\"Ещё\">\u003csvg class=\"i\">\u003cuse href=\"#i-more\" />\u003c/svg>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"lg-scroll-edge lg-scroll-edge--top\" data-lg-adaptive aria-hidden=\"true\">\u003c/div>\n\n  \u003cdiv id=\"moreMenu\" class=\"lg lg-thick lg-menu\" role=\"menu\" hidden>\n    \u003cdiv class=\"lg-menu__content\">\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-tier=\"auto\">Уровень: авто\u003c/button>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-tier=\"2\">T2 — запросить SVG-линзу\u003c/button>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-tier=\"1\">T1 — матовое стекло\u003c/button>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-tier=\"0\">T0 — без прозрачности\u003c/button>\n      \u003cdiv class=\"lg-menu__sep\">\u003c/div>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-appearance>Внешний вид…\u003c/button>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-theme=\"light\">Светлая тема\u003c/button>\n      \u003cbutton class=\"lg-menu__item\" role=\"menuitem\" data-theme=\"dark\">Тёмная тема\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- Content layer -->\n  \u003cmain>\n    \u003csection class=\"hero\" data-lg-surface=\"dark\">\n      \u003cdiv class=\"orb\" style=\"width:220px;height:220px;left:8%;top:18%\">\u003c/div>\n      \u003cdiv class=\"orb\" style=\"width:120px;height:120px;right:14%;top:58%\">\u003c/div>\n      \u003cdiv>\n        \u003ch1>Liquid\u003cbr />Glass\u003c/h1>\n        \u003cp>Прозрачный материал на живом фоне. Сравните blur и линзу ниже.\u003c/p>\n        \u003cp>\u003ca href=\"motion.html\" style=\"color:inherit\">Попробовать три анимации →\u003c/a>\u003c/p>\n        \u003cp>\u003ca href=\"controls.html\" style=\"color:inherit\">Ползунок с каплей и живые controls →\u003c/a>\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"optics-section\" data-lg-surface=\"dark\">\n      \u003cdiv class=\"wrap\">\n        \u003cdiv class=\"eyebrow\">Оптика\u003c/div>\n        \u003ch2>Линза проверяется движением\u003c/h2>\n        \u003cp class=\"lead\">Останови фон и сравни режимы на одном кадре. Ищи изгиб линий у кромки при включённом blur; текст поверх стекла должен оставаться чётким. \u003ca href=\"optics.html\" style=\"color:inherit\">Сравнить материалы и другие фоны →\u003c/a>\u003c/p>\n        \u003cdiv class=\"lg lg-seg lg-lens\" id=\"opticsMode\" role=\"tablist\" aria-label=\"Режим оптики\" data-lg-appearance=\"dark\">\n          \u003cspan class=\"lg-indicator\">\u003c/span>\n          \u003cbutton class=\"lg-seg__item\" role=\"tab\" aria-selected=\"true\">Линза + blur\u003c/button>\n          \u003cbutton class=\"lg-seg__item\" role=\"tab\">Только линза\u003c/button>\n          \u003cbutton class=\"lg-seg__item\" role=\"tab\">Только blur\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"optics-stage\" id=\"opticsStage\" data-mode=\"lens-blur\">\n          \u003cdiv class=\"optics-grid\" aria-hidden=\"true\">\u003c/div>\n          \u003cdiv class=\"lg lg-clear optics-tile\" data-lg-appearance=\"light\">\n            \u003cdiv>\n              \u003cstrong>Набережная\u003c/strong>\n              \u003cspan>Живой фон под стеклом · чёткий текст поверх\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cbutton class=\"optics-pause\" id=\"opticsPause\" type=\"button\" aria-pressed=\"false\">Остановить фон для сравнения\u003c/button>\n        \u003cp class=\"optics-note\" id=\"opticsNote\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection data-lg-surface=\"auto\">\n      \u003cdiv class=\"wrap\">\n        \u003cdiv class=\"eyebrow\">Материал\u003c/div>\n        \u003ch2>Кнопки и варианты\u003c/h2>\n        \u003cp class=\"lead\">Regular — по умолчанию. Clear — только поверх яркого медиа. Tinted/Prominent — для одного главного действия. Нажмите и потяните кнопку: стекло набухает, светится из точки касания и пружинит.\u003c/p>\n        \u003cdiv class=\"stage stage--stripes\">\n          \u003cbutton class=\"lg lg-btn lg-interactive lg-lens\">Regular\u003c/button>\n          \u003cbutton class=\"lg lg-btn lg-clear lg-interactive lg-lens\">Clear\u003c/button>\n          \u003cbutton class=\"lg lg-btn lg-tinted lg-interactive lg-lens\">Tinted\u003c/button>\n          \u003cbutton class=\"lg lg-btn lg-prominent lg-interactive lg-lens\">Prominent\u003c/button>\n          \u003cbutton class=\"lg lg-btn lg-icon-btn lg-interactive lg-lens\" aria-label=\"Добавить\">\u003csvg class=\"i\">\u003cuse href=\"#i-plus\" />\u003c/svg>\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"stage stage--photo\">\n          \u003cdiv class=\"stage__row\">\n            \u003cdiv class=\"lg lg-group lg-lens\" data-lg-appearance=\"dark\">\n              \u003cbutton class=\"lg-item\" aria-label=\"Назад\">\u003csvg class=\"i\">\u003cuse href=\"#i-back\" />\u003c/svg>\u003c/button>\n              \u003cbutton class=\"lg-item\">Изменить\u003c/button>\n              \u003cbutton class=\"lg-item\" aria-label=\"Поделиться\">\u003csvg class=\"i\">\u003cuse href=\"#i-share\" />\u003c/svg>\u003c/button>\n            \u003c/div>\n            \u003cbutton class=\"lg lg-btn lg-icon-btn lg-clear lg-interactive lg-lens\" aria-label=\"Нравится\">\u003csvg class=\"i\">\u003cuse href=\"#i-heart\" />\u003c/svg>\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stage stage--text\">\n          \u003cp class=\"stage__bgtext\" aria-hidden=\"true\">Liquid Glass — это не размытие ради размытия. Материал ведёт себя как линза: в центре контент почти не искажён, а у кромки лучи преломляются и изображение под стеклом изгибается. Размытие лёгкое, насыщенность повышена, по контуру бежит блик. Стекло живёт только в слое навигации и всегда парит над контентом, который прокручивается под ним. Liquid Glass — это не размытие ради размытия. Материал ведёт себя как линза: в центре контент почти не искажён, а у кромке лучи преломляются.\u003c/p>\n          \u003cdiv class=\"stage__row\" style=\"margin-top:40px\">\n            \u003cdiv class=\"lg lg-search lg-lens\" style=\"width:min(420px,100%)\">\u003csvg class=\"i\">\u003cuse href=\"#i-search\" />\u003c/svg>\u003cinput placeholder=\"Поиск\" aria-label=\"Поиск\" />\u003c/div>\n            \u003cbutton class=\"lg lg-btn lg-interactive lg-lens\">Готово\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection data-lg-surface=\"auto\">\n      \u003cdiv class=\"wrap\">\n        \u003cdiv class=\"eyebrow\">Элементы управления\u003c/div>\n        \u003ch2>Жидкий индикатор, переключатели\u003c/h2>\n        \u003cp class=\"lead\">Индикатор выбора — это капля: передний край догоняет цель быстрее заднего, поэтому она растягивается и схлопывается. Её можно тянуть пальцем. Бегунок переключателя при нажатии превращается в прозрачную линзу.\u003c/p>\n        \u003cdiv class=\"controls\">\n          \u003cdiv class=\"control-card\">\n            \u003ch3>Segmented control\u003c/h3>\n            \u003cdiv class=\"lg lg-seg lg-lens\" id=\"seg\" aria-label=\"Период\">\n              \u003cspan class=\"lg-indicator\">\u003c/span>\n              \u003cbutton class=\"lg-seg__item\" role=\"tab\">День\u003c/button>\n              \u003cbutton class=\"lg-seg__item\" role=\"tab\">Неделя\u003c/button>\n              \u003cbutton class=\"lg-seg__item\" role=\"tab\">Месяц\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"control-card\">\n            \u003ch3>Switch\u003c/h3>\n            \u003clabel class=\"switch-row\">Wi-Fi\u003cspan class=\"lg-switch\">\u003cinput type=\"checkbox\" role=\"switch\" checked />\u003cspan class=\"lg-switch__track\">\u003c/span>\u003cspan class=\"lg-switch__thumb\">\u003c/span>\u003c/span>\u003c/label>\n            \u003clabel class=\"switch-row\">Bluetooth\u003cspan class=\"lg-switch\">\u003cinput type=\"checkbox\" role=\"switch\" />\u003cspan class=\"lg-switch__track\">\u003c/span>\u003cspan class=\"lg-switch__thumb\">\u003c/span>\u003c/span>\u003c/label>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"gl-section\" data-lg-surface=\"dark\">\n      \u003cdiv class=\"wrap\">\n        \u003cdiv class=\"eyebrow\">T3 · WebGL2\u003c/div>\n        \u003ch2>Капли сливаются\u003c/h2>\n        \u003cp class=\"lead\">Шейдерное стекло: smooth-union SDF, рефракция по закону Снеллиуса, дисперсия на кромке. Перетащите круглую каплю к панели.\u003c/p>\n        \u003cdiv class=\"gl-scene\" id=\"glScene\">\n          \u003ccanvas class=\"gl-stage\" id=\"glStage\" aria-label=\"Демо слияния стеклянных капель\">\u003c/canvas>\n          \u003cdiv class=\"gl-solid\" id=\"glFallback\" aria-hidden=\"true\" hidden>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"gl-status\" id=\"glStatus\" role=\"status\">\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection data-lg-surface=\"auto\">\n      \u003cdiv class=\"wrap\">\n        \u003cdiv class=\"eyebrow\">Иерархия\u003c/div>\n        \u003ch2>Контент — не стекло\u003c/h2>\n        \u003cp class=\"lead\">Карточки и списки остаются непрозрачными и прокручиваются под плавающими стеклянными панелями.\u003c/p>\n        \u003cdiv class=\"list\" id=\"list\">\u003c/div>\n        \u003cdiv class=\"spacer\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv class=\"lg-scroll-edge lg-scroll-edge--bottom\" data-lg-adaptive aria-hidden=\"true\">\u003c/div>\n  \u003cnav class=\"demo-bottom\" aria-label=\"Разделы\">\n    \u003cdiv class=\"lg lg-tabbar lg-lens\" id=\"tabbar\" data-lg-adaptive>\n      \u003cspan class=\"lg-indicator\">\u003c/span>\n      \u003cbutton class=\"lg-tab\" role=\"tab\">\u003csvg class=\"i\">\u003cuse href=\"#i-home\" />\u003c/svg>Главная\u003c/button>\n      \u003cbutton class=\"lg-tab\" role=\"tab\">\u003csvg class=\"i\">\u003cuse href=\"#i-grid\" />\u003c/svg>Обзор\u003c/button>\n      \u003cbutton class=\"lg-tab\" role=\"tab\">\u003csvg class=\"i\">\u003cuse href=\"#i-heart\" />\u003c/svg>Избранное\u003c/button>\n      \u003cbutton class=\"lg-tab\" role=\"tab\">\u003csvg class=\"i\">\u003cuse href=\"#i-user\" />\u003c/svg>Профиль\u003c/button>\n    \u003c/div>\n    \u003cbutton class=\"lg lg-btn lg-icon-btn lg-interactive lg-lens demo-search\" data-lg-adaptive aria-label=\"Поиск\">\u003csvg class=\"i\">\u003cuse href=\"#i-search\" />\u003c/svg>\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- Appearance settings: one density for the whole app, with a live preview -->\n  \u003cdiv class=\"settings\" id=\"settings\" hidden>\n    \u003cdiv class=\"settings__panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"settingsTitle\">\n      \u003cdiv class=\"settings__head\">\n        \u003ch2 id=\"settingsTitle\">Внешний вид\u003c/h2>\n        \u003cbutton class=\"settings__close\" id=\"settingsClose\" aria-label=\"Закрыть\">×\u003c/button>\n      \u003c/div>\n      \u003clabel class=\"settings__label\" for=\"density\">Liquid Glass \u003coutput id=\"densityValue\" for=\"density\">\u003c/output>\u003c/label>\n      \u003cinput id=\"density\" type=\"range\" min=\"0\" max=\"100\" value=\"50\" aria-describedby=\"densityStatus\" />\n      \u003cdiv class=\"settings__ends\">\u003cspan>Прозрачный\u003c/span>\u003cspan>Плотный\u003c/span>\u003c/div>\n      \u003cdiv class=\"settings__preview\">\n        \u003cdiv class=\"preview__stage\">\n          \u003cdiv class=\"preview__bg\" aria-hidden=\"true\">\u003c/div>\n          \u003cdiv class=\"lg preview__tile lg-lens\">\u003cspan>Образец\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cp class=\"settings__status\" id=\"densityStatus\" aria-live=\"polite\">\u003c/p>\n      \u003cdiv class=\"settings__actions\">\n        \u003cbutton class=\"btn\" id=\"densityReset\">По умолчанию\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \n\u003cscript>\n(() => {\n\"use strict\";\nconst __definitions = {\n\"liquid-glass.js\": function(__exports, __load) {\n\"use strict\";\n/*\n * Liquid Glass — reference runtime for the web (ES module, zero dependencies).\n *\n *   import { initLiquidGlass } from './liquid-glass.js';\n *   initLiquidGlass();          // detects the tier, enhances .lg-lens / .lg-interactive / [data-lg-adaptive]\n *\n * Tiers (html[data-lg-tier]):\n *   0 solid      — no transparency (Reduce Transparency, forced colors, no backdrop-filter)\n *   1 frosted    — blur + saturation + tint + rim (default CSS; Safari, Firefox, weak devices)\n *   2 lens       — + edge refraction through an SVG displacement map (Chromium only)\n *   3 liquid     — + WebGL shader glass (opt-in, see liquid-glass-webgl.js)\n *\n * Every animation is a spring (see docs/05-motion.md). Motion is transform/opacity only.\n */\n\n// ---------------------------------------------------------------------------\n// Motion tokens (response in seconds, SwiftUI semantics). Keep in sync with tokens/.\n// ---------------------------------------------------------------------------\n\nconst MOTION = {\n  interactive: { response: 0.15, dampingRatio: 0.86 },\n  press: { response: 0.22, dampingRatio: 0.65 },\n  release: { response: 0.38, dampingRatio: 0.55 },\n  snappy: { response: 0.3, dampingRatio: 0.85 },\n  morph: { response: 0.42, dampingRatio: 0.78 },\n  bouncy: { response: 0.5, dampingRatio: 0.7 },\n  smooth: { response: 0.5, dampingRatio: 1 },\n  // selection indicator: the leading edge runs ahead, the trailing edge catches up\n  lead: { response: 0.24, dampingRatio: 0.8 },\n  trail: { response: 0.42, dampingRatio: 0.74 },\n  dismiss: { response: 0.28, dampingRatio: 1 },\n};\n\nconst hasWindow = typeof window !== 'undefined';\nconst mq = (q) => hasWindow && typeof matchMedia === 'function' && matchMedia(q).matches;\n\nconst prefersReducedMotion = () => mq('(prefers-reduced-motion: reduce)');\nconst clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\n\n// ---------------------------------------------------------------------------\n// Spring (semi-implicit Euler, fixed 1/240 s sub-steps: stable, interruptible,\n// keeps velocity when the target changes mid-flight).\n// ---------------------------------------------------------------------------\n\nclass Spring {\n  constructor(value = 0, config = MOTION.snappy) {\n    this.value = value;\n    this.target = value;\n    this.velocity = 0;\n    this.precision = 1e-3;\n    this.configure(config);\n  }\n  configure({ response, dampingRatio }) {\n    const omega = (2 * Math.PI) / response;\n    this.stiffness = omega * omega;\n    this.damping = 2 * dampingRatio * omega;\n    return this;\n  }\n  set(value) {\n    this.value = this.target = value;\n    this.velocity = 0;\n    return this;\n  }\n  step(d 0 must cover every sample and never leave a stale SVG filter. */\n    html[data-lg-tier=\"0\"] .lg.glass { --lg-fill: #f4f6f9; }\n    html[data-theme=\"dark\"][data-lg-tier=\"0\"] .lg.glass { --lg-fill: #19222e; }\n    [data-lg-tier=\"0\"] .glass::before { backdrop-filter: none; -webkit-backdrop-filter: none; transition: none; }\n    @media (forced-colors: active) {\n      .glass, .content { color: CanvasText; }\n      .glass::before { background: Canvas; box-shadow: none; }\n      .glass::after { background: none; border: 1px solid CanvasText; padding: 0; mask: none; -webkit-mask: none; }\n    }\n    @media (max-width: 760px) {\n      body { padding: 30px 18px; }\n      .comparison { grid-template-columns: 1fr; }\n      .scene { height: 280px; }\n      .glass { inset-block-start: 66px; }\n      .controls { grid-template-columns: 1fr; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003ch1>Сквозь стекло должен быть виден мир.\u003c/h1>\n  \u003cp>Один фон, три материала. Перемещай фон и включай линзу в третьем образце на том же кадре. Ищи изгиб у кромки при рабочем blur, сохраняя чёткую надпись поверх.\u003c/p>\n  \u003cdiv class=\"comparison\">\n    \u003cfigure>\u003cdiv class=\"scene\">\u003cdiv class=\"map\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"lg glass dense\">\u003cdiv class=\"content\">\u003cstrong>Набережная\u003c/strong>\u003cspan>Пешая прогулка · 12 мин\u003c/span>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 12h15m-6-6 6 6-6 6\"/>\u003c/svg>\u003c/div>\u003c/div>\u003c/div>\u003cfigcaption>\u003ch2>1. Плотная заливка\u003c/h2>\u003cp>В обычном режиме — 82% заливки: blur есть, но фон почти скрыт.\u003c/p>\u003c/figcaption>\u003c/figure>\n    \u003cfigure>\u003cdiv class=\"scene\">\u003cdiv class=\"map\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"lg glass\">\u003cdiv class=\"content\">\u003cstrong>Набережная\u003c/strong>\u003cspan>Пешая прогулка · 12 мин\u003c/span>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 12h15m-6-6 6 6-6 6\"/>\u003c/svg>\u003c/div>\u003c/div>\u003c/div>\u003cfigcaption>\u003ch2>2. Прозрачность + blur\u003c/h2>\u003cp>При включённой прозрачности фон виден и размыт. Линза не запрошена.\u003c/p>\u003c/figcaption>\u003c/figure>\n    \u003cfigure>\u003cdiv class=\"scene\">\u003cdiv class=\"map\" aria-hidden=\"true\">\u003c/div>\u003cdiv id=\"lens\" class=\"lg glass lg-lens\">\u003cdiv class=\"content\">\u003cstrong>Набережная\u003c/strong>\u003cspan>Пешая прогулка · 12 мин\u003c/span>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 12h15m-6-6 6 6-6 6\"/>\u003c/svg>\u003c/div>\u003c/div>\u003c/div>\u003cfigcaption>\u003ch2 id=\"lensCaption\">3. Запрошена линза + blur\u003c/h2>\u003cp>Сравни кромку со вторым образцом. Изгиб должен быть виден без деформации текста поверх.\u003c/p>\u003c/figcaption>\u003c/figure>\n  \u003c/div>\n  \u003cdiv class=\"controls\">\n    \u003cdiv>\u003clabel for=\"density\">Liquid Glass \u003coutput id=\"densityValue\" for=\"density\">\u003c/output>\u003c/label>\u003cinput id=\"density\" type=\"range\" min=\"0\" max=\"100\" value=\"15\">\u003cdiv class=\"ends\">\u003cspan>Прозрачный\u003c/span>\u003cspan>Плотный\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv>\u003clabel for=\"background\">Положение фона\u003c/label>\u003cinput id=\"background\" type=\"range\" min=\"-80\" max=\"80\" value=\"0\">\u003cdiv class=\"ends\">\u003cspan>Влево\u003c/span>\u003cspan>Вправо\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv>\u003clabel for=\"backdrop\">Фон под материалом\u003c/label>\u003cselect id=\"backdrop\">\u003coption value=\"map\">Карта с линиями\u003c/option>\u003coption value=\"color\">Цветные формы\u003c/option>\u003coption value=\"page\">Обычная страница\u003c/option>\u003c/select>\u003c/div>\n    \u003cdiv>\u003clabel>\u003cinput id=\"lensEnabled\" type=\"checkbox\" checked> Запросить линзу в третьем образце\u003c/label>\u003cp class=\"note\">Выключи и включи её на неподвижном фоне. Плотность и blur при сравнении сохраняются.\u003c/p>\u003c/div>\n    \u003cdiv class=\"actions\">\u003cbutton id=\"reset\">По умолчанию\u003c/button>\u003cbutton id=\"theme\">Тёмная тема\u003c/button>\u003clabel>\u003cinput id=\"reduce\" type=\"checkbox\"> Уменьшить прозрачность\u003c/label>\u003c/div>\n  \u003c/div>\n  \u003coutput id=\"status\" aria-live=\"polite\">\u003c/output>\n  \u003cp class=\"note\">Это проверка веб-рендерера, не снимок Apple и не обещание одинакового эффекта на Android или Windows. Первый образец фиксирован; ползунок меняет два прозрачных материала. Ширина и сила линзы настроены для этой сцены, а не для каждого компонента продукта. \u003ca href=\"demo.html\">Открыть остальные компоненты\u003c/a>.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(() => {\n\"use strict\";\nconst __definitions = {\n\"liquid-glass.js\": function(__exports, __load) {\n\"use strict\";\n/*\n * Liquid Glass — reference runtime for the web (ES module, zero dependencies).\n *\n *   import { initLiquidGlass } from './liquid-glass.js';\n *   initLiquidGlass();          // detects the tier, enhances .lg-lens / .lg-interactive / [data-lg-adaptive]\n *\n * Tiers (html[data-lg-tier]):\n *   0 solid      — no transparency (Reduce Transparency, forced colors, no backdrop-filter)\n *   1 frosted    — blur + saturation + tint + rim (default CSS; Safari, Firefox, weak devices)\n *   2 lens       — + edge refraction through an SVG displacement map (Chromium only)\n *   3 liquid     — + WebGL shader glass (opt-in, see liquid-glass-webgl.js)\n *\n * Every animation is a spring (see docs/05-motion.md). Motion is transform/opacity only.\n */\n\n// ---------------------------------------------------------------------------\n// Motion tokens (response in seconds, SwiftUI semantics). Keep in sync with tokens/.\n// ---------------------------------------------------------------------------\n\nconst MOTION = {\n  interactive: { response: 0.15, dampingRatio: 0.86 },\n  press lection indicator (see liquidIndicator() in JS). */\n.lg-tabbar {\n  --lg-radius: 9999px;\n  display: flex;\n  align-items: stretch;\n  height: 62px;\n  padding: 4px;\n}\n.lg-tab {\n  position: relative;\n  z-index: 1;\n  display: flex;\n  flex: 1 1 0;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 3px;\n  min-width: 68px;\n  padding: 0 8px;\n  border: 0;\n  background: none;\n  color: var(--lgv-label);\n  font: 600 10px/1.1 var(--lg-font);\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n  transition: color 0.25s ease;\n}\n.lg-tab svg { width: 24px; height: 24px; }\n.lg-tab[aria-selected=\"true\"] { color: var(--lg-accent); }\n\n/* The indicator lives INSIDE the glass bar: it is a fill, not a second backdrop. */\n.lg-indicator {\n  position: absolute;\n  top: 4px;\n  bottom: 4px;\n  left: 0;\n  width: 0;\n  z-index: 0;\n  border-radius: 9999px;\n  background: var(--lgv-indicator);\n  pointer-events: none;\n  transition: background-color 0.2s ease, box-shadow 0.2s ease;\n}\n.lg-indicator[data-lg-dragging] {\n  background: rgb(255 255 255 / 0.1);\n  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.55), inset 0 1px 2px rgb(255 255 255 / 0.6),\n    0 6px 18px rgb(0 0 0 / 0.18);\n}\n\n/* Segmented control */\n.lg-seg {\n  --lg-radius: 9999px;\n  display: inline-flex;\n  padding: 3px;\n  height: var(--lg-h-md);\n}\n.lg-seg .lg-indicator { top: 3px; bottom: 3px; }\n.lg-seg__item {\n  position: relative;\n  z-index: 1;\n  flex: 1 1 0;\n  min-width: 72px;\n  padding: 0 14px;\n  border: 0;\n  border-radius: 9999px;\n  background: none;\n  color: var(--lgv-label);\n  font: 600 13px/1 var(--lg-font);\n  cursor: pointer;\n  -webkit-tap-highlight-color: transparent;\n}\n\n/* Switch: \u003clabel class=\"lg-switch\">\u003cinput type=\"checkbox\" role=\"switch\">\u003cspan class=\"lg-switch__track\">\u003c/span>\u003cspan class=\"lg-switch__thumb\">\u003c/span>\u003c/label>\n * On press the thumb turns into a clear glass lens and swells (like iOS 26). */\n.lg-switch {\n  position: relative;\n  display: inline-block;\n  flex: none;\n  width: 64px;\n  height: 28px;\n  -webkit-tap-highlight-color: transparent;\n}\n.lg-switch input {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  opacity: 0;\n  cursor: pointer;\n}\n.lg-switch__track {\n  position: absolute;\n  inset: 0;\n  border-radius: 9999px;\n  background: rgb(120 120 128 / 0.2);\n  transition: background-color 0.25s ease;\n}\n.lg-switch input:checked ~ .lg-switch__track { background: var(--lg-green); }\n.lg-switch__thumb {\n  position: absolute;\n  top: 2px;\n  left: 2px;\n  width: 38px;\n  height: 24px;\n  border-radius: 9999px;\n  background: #fff;\n  box-shadow: 0 2px 6px rgb(0 0 0 / 0.18), 0 0 0 0.5px rgb(0 0 0 / 0.04);\n  translate: 0 0;\n  scale: 1;\n  transition:\n    translate var(--lg-dur-snappy) var(--lg-ease-snappy),\n    scale var(--lg-dur-release) var(--lg-ease-release),\n    background-color 0.2s ease,\n    box-shadow 0.2s ease;\n  pointer-events: none;\n}\n.lg-switch input:checked ~ .lg-switch__thumb { translate: 22px 0; }\n.lg-switch input:active ~ .lg-switch__thumb {\n  scale: 1.45 1.5;\n  background: rgb(255 255 255 / 0.12);\n  box-shadow: inset 0 0 0 0.75px rgb(255 255 255 / 0.9), inset 0 1px 2px rgb(255 255 255 / 0.7),\n    inset 0 -2px 6px rgb(255 255 255 / 0.25), 0 4px 12px rgb(0 0 0 / 0.16);\n  -webkit-backdrop-filter: blur(0.6px) saturate(1.8) brightness(1.08);\n  backdrop-filter: blur(0.6px) saturate(1.8) brightness(1.08);\n  transition:\n    translate var(--lg-dur-snappy) var(--lg-ease-snappy),\n    scale var(--lg-dur-press) var(--lg-ease-press),\n    background-color 0.12s ease,\n    box-shadow 0.12s ease;\n}\n.lg-switch input:focus-visible ~ .lg-switch__track {\n  outline: 2px solid var(--lg-accent);\n  outline-offset: 2px;\n}\n\n/* Search field */\n.lg-search {\n  --lg-radius: 9999px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  height: var(--lg-h-lg);\n  padding: 0 16px;\n}\n.lg-search svg { width: 18px; height: 18px; flex: none; opacity: 0.7; }\n.lg-search input {\n  flex: 1;\n  min-width: 0;\n  border: 0;\n  outline: 0;\n  background: none;\n  color: inherit;\n  font: 400 17px/1.2 var(--lg-font);\n}\n.lg-search input::placeholder { color: var(--lgv-label-2); }\n.lg-search:focus-within { box-shadow: var(--lg-shadow), 0 0 0 2px var(--lg-accent); }\n\n/* Menu / popover (thick glass). Open with morphOpen(button, menu) from JS. */\n.lg-menu {\n  --lg-radius: var(--lg-radius-lg);\n  min-width: 220px;\n  padding: 6px;\n  transform-origin: 0 0;\n}\n.lg-menu[hidden] { display: none; }\n.lg-menu__content { transform-origin: 0 0; }\n.lg-menu__item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  height: 40px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: max(var(--lg-radius-lg) - 6px, 6px); /* concentric with the menu */\n  background: none;\n  color: inherit;\n  font: 500 15px/1 var(--lg-font);\n  text-align: left;\n  cursor: pointer;\n}\n.lg-menu__item:hover,\n.lg-menu__item:focus-visible { background: var(--lgv-hover); outline: 0; }\n.lg-menu__sep { height: 1px; margin: 6px 12px; background: var(--lgv-label-2); opacity: 0.25; }\n\n/* Sheet: inset floating glass at partial height, attaches to the edges when expanded. */\n.lg-sheet {\n  --lg-radius: var(--lg-radius-2xl);\n  position: fixed;\n  left: 8px;\n  right: 8px;\n  bottom: 8px;\n  padding: 20px;\n  transition:\n    inset var(--lg-dur-smooth) var(--lg-ease-smooth),\n    border-radius var(--lg-dur-smooth) var(--lg-ease-smooth),\n    background-color 0.3s ease;\n}\n.lg-sheet[data-detent=\"large\"] {\n  --lg-fill: var(--lgv-solid);\n  left: 0;\n  right: 0;\n  bottom: 0;\n  border-bottom-left-radius: 0;\n  border-bottom-right-radius: 0;\n}\n\n/* Scroll edge effect: content softly dissolves under floating bars (no hard divider). */\n.lg-scroll-edge {\n  position: fixed;\n  left: 0;\n  right: 0;\n  z-index: 9;\n  height: var(--lg-edge-height, 96px);\n  pointer-events: none;\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n}\n.lg-scroll-edge--top {\n  top: 0;\n  background: linear-gradient(to bottom, rgb(var(--lgv-canvas) / 0.55), rgb(var(--lgv-canvas) / 0));\n  -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent);\n  mask-image: linear-gradient(to bottom, #000 35%, transparent);\n}\n.lg-scroll-edge--bottom {\n  bottom: 0;\n  background: linear-gradient(to top, rgb(var(--lgv-canvas) / 0.55), rgb(var(--lgv-canvas) / 0));\n  -webkit-mask-image: linear-gradient(to top, #000 35%, transparent);\n  mask-image: linear-gradient(to top, #000 35%, transparent);\n}\nhtml[data-lg-tier=\"0\"] .lg-scroll-edge,\nhtml[data-lg-tier=\"1\"] .lg-scroll-edge--bottom {\n  /* weak devices: keep only the gradient, drop the blur */\n  -webkit-backdrop-filter: none;\n  backdrop-filter: none;\n}\n\n.lg-label-2 { color: var(--lgv-label-2); }\n\n/* Use on semantic hit targets whose feedback is painted by glass/canvas.\n * Keep native input behaviour and :focus-visible; only remove the rectangular\n * WebKit/Chromium touch overlay over the independently rendered shape. */\n.lg-hit-target { -webkit-tap-highlight-color: transparent; }\n\n\u003c/style>\n  \u003cstyle>\n    * { box-sizing: border-box; }\n    body { margin: 0; background: #f3f5f8; color: #172332; font: 16px/1.5 system-ui, sans-serif; }\n    main { max-width: 1220px; margin: auto; padding: 36px 24px 48px; }\n    a { color: inherit; }\n    h1 { margin: 12px 0; font-size: clamp(32px, 5vw, 52px); letter-spacing: -.045em; line-height: 1.08; }\n    h2 { margin: 0 0 8px; font-size: 21px; letter-spacing: -.025em; }\n    p { margin: 0; }\n    .intro { max-width: 760px; color: #536273; }\n    button, input { font: inherit; }\n    button { cursor: pointer; }\n    button:focus-visible, input:focus-visible { outline: 3px solid #1473e6; outline-offset: 4px; }\n    button:disabled { cursor: default; }\n    .settings { margin: 28px 0; padding: 18px 22px; background: white; border: 1px solid #dbe1e8; border-radius: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px 28px; align-items: center; }\n    .settings label { display: block; }\n    .settings input[type=\"range\"] { width: 100%; margin: 12px 0 0; accent-color: #2375ce; }\n    .settings input[type=\"checkbox\"] { width: 18px; height: 18px; vertical-align: middle; }\n    .settings .checks { display: grid; gap: 10px; }\n    .ends { display: flex; justify-content: space-between; font-size: 12px; color: #617286; }\n    .plain { min-height: 44px; padding: 8px 16px; border-radius: 14px; border: 1px solid #aab7c7; background: white; color: #172332; }\n    .experiments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }\n    article { min-width: 0; }\n    .description { min-height: 66px; color: #536273; font-size: 14px; }\n    .scene { position: relative; height: 280px; margin: 16px 0; border-radius: 26px; overflow: hidden; background: #a1d4e2; color: #152536; }\n    .backdrop { position: absolute; inset: -100px; pointer-events: none; transform: translateX(var(--scene-shift, 0px)) rotate(-18deg); background:\n      repeating-linear-gradient(0deg, transparent 0 47px, rgb(255 255 255 / .9) 47px 51px, #738e9b 51px 52px, transparent 52px 76px),\n      repeating-linear-gradient(90deg, transparent 0 71px, rgb(255 255 255 / .85) 71px 75px, transparent 75px 112px),\n      linear-gradient(125deg, #cddbb8 0 30%, #f6cf9c 30% 45%, #a1d4e2 45% 78%, #d5c6ef 78%); }\n    .press-button { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 236px; max-width: calc(100% - 40px); height: 64px; padding: 0; border: 0; background: none; color: #152536; border-radius: 24px; touch-action: manipulation; }\n    .press-material { position: absolute; inset: 0; pointer-events: none; --lg-blur: 2.5px; --lg-saturate: 1.12; --lgv-inner: transparent; }\n    .press-label { position: relative; z-index: 2; font-weight: 650; }\n    .motion-track { position: absolute; left: 16px; right: 16px; top: 108px; height: 64px; display: flex; gap: 0; padding: 4px; border-radius: 28px; background: rgb(255 255 255 / .18); border: 1px solid rgb(255 255 255 / .6); touch-action: pan-y; }\n    .motion-indicator { position: absolute; left: 4px; top: 4px; height: 54px; pointer-events: none; --lg-radius: 23px; --lg-blur: 2.5px; --lg-saturate: 1.12; --lgv-inner: transparent; transform-origin: center; }\n    .motion-tab { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0; padding: 0 2px; border: 0; border-radius: 23px; background: none; color: #20364a; font-size: 13px; line-height: 1; font-weight: 650; }\n    .motion-tab[aria-selected=\"true\"] { color: #09274a; }\n    .picker-caption { display: flex; align-items: center; gap: 5px; pointer-events: none; white-space: nowrap; }\n    .picker-icon { display: block; flex: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n    .picker-baseline { display: inline-block; width: 0; height: 0; margin: 0; padding: 0; border: 0; vertical-align: baseline; }\n    [data-picker-content=\"canvas\"] .picker-caption { opacity: 0; }\n    [data-picker-renderer=\"webgl\"] .motion-track { background: none; border-color: transparent; }\n    :root[data-lg-tier=\"0\"] .motion-track { background: #f9f9fb; border-color: #8993a0; }\n    :root[data-lg-tier=\"0\"] .motion-indicator::before { transition: none; }\n    .picker-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }\n    .picker-note { color: #536273; font-size: 12px; margin-top: 8px; }\n    .status { display: block; min-height: 24px; margin: 10px 0 14px; font-size: 14px; color: #536273; }\n    .morph-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }\n    .morph-fallback { position: absolute; pointer-events: none; --lg-blur: 2.5px; --lg-saturate: 1.12; }\n    .morph-origin { position: absolute; z-index: 2; left: calc(50% - 78px); bottom: 22px; width: 156px; height: 52px; border: 0; background: none; color: #152536; font-weight: 650; border-radius: 26px; }\n    .morph-panel { position: absolute; z-index: 2; left: 16px; right: 16px; top: 36px; height: 188px; padding: 23px 20px; }\n    .morph-panel[hidden], [hidden] { display: none !important; }\n    .morph-panel h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.02em; }\n    .morph-panel p { font-size: 14px; }\n    .morph-panel .start { margin-top: 18px; min-height: 44px; padding: 9px 14px; border: 0; border-radius: 12px; background: #145d9a; color: white; }\n    .morph-close { position: absolute; right: 6px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: inherit; font-size: 23px; }\n    .explanation { margin-top: 30px; font-size: 14px; color: #536273; max-width: 900px; }\n    .flow-experiment { margin: 36px 0; }\n    .flow-experiment .description { min-height: 0; max-width: 760px; }\n    .flow-scene { height: 360px; margin-top: 20px; }\n    .flow-content { position: absolute; z-index: 2; padding: 21px 24px; pointer-events: none; }\n    .flow-content h3 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.025em; }\n    .flow-content p { font-size: 14px; }\n    .flow-content small { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }\n    .flow-dock { position: absolute; z-index: 2; width: 56px; height: 56px; display: grid; place-items: center; line-height: 1; pointer-events: none; }\n    .flow-dock svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n    .flow-fallback { position: absolute; pointer-events: none; --lg-blur: 2.5px; }\n    .flow-controls { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }\n    .flow-controls label { display: flex; gap: 8px; align-items: center; }\n    .flow-note { color: #536273; font-size: 13px; margin-top: 12px; }\n    html[data-theme=\"dark\"] body { background: #111923; color: #edf2f8; }\n    html[data-theme=\"dark\"] .settings { background: #1c2836; border-color: #425166; }\n    html[data-theme=\"dark\"] .intro, html[data-theme=\"dark\"] .description, html[data-theme=\"dark\"] .status, html[data-theme=\"dark\"] .explanation, html[data-theme=\"dark\"] .ends { color: #b7c5d5; }\n    html[data-theme=\"dark\"] .flow-note { color: #b7c5d5; }\n    html[data-theme=\"dark\"] .picker-note { color: #b7c5d5; }\n    @media (max-width: 860px) { .experiments { grid-template-columns: 1fr; } .description { min-height: 0; } .scene { max-width: 560px; } .settings { grid-template-columns: 1fr 1fr; } }\n    @media (max-width: 480px) { main { padding: 24px 16px 40px; } .settings { grid-template-columns: 1fr; padding: 16px; } }\n    @media (max-width: 640px) { .flow-scene { height: 440px; } .flow-content { padding: 21px 18px; } .flow-content h3 { font-size: 20px; } }\n    @media (forced-colors: active) { body, .scene, .settings { background: Canvas; color: CanvasText; } .backdrop { display: none; } .motion-track { border-color: CanvasText; } .motion-tab, .press-button, .morph-origin, .morph-panel { color: CanvasText; } .motion-tab[aria-selected=\"true\"] { text-decoration: underline; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003ca href=\"demo.html\">← Все компоненты\u003c/a>\n  \u003ca href=\"controls.html\" style=\"margin-left:20px\">Ползунок с каплей и другие controls →\u003c/a>\n  \u003ch1>Стекло отвечает на действие.\u003c/h1>\n  \u003cp class=\"intro\">Три небольших опыта. Нажимай, удерживай и меняй направление до остановки — переход продолжится из текущего состояния.\u003c/p>\n  \u003cdiv class=\"settings\" aria-label=\"Внешний вид и доступность\">\n    \u003cdiv>\u003clabel for=\"density\">Liquid Glass \u003coutput id=\"densityValue\" for=\"density\">\u003c/output>\u003c/label>\u003cinput id=\"density\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\u003cdiv class=\"ends\">\u003cspan>Прозрачный\u003c/span>\u003cspan>Плотный\u003c/span>\u003c/div>\u003cbutton class=\"plain\" id=\"densityReset\" type=\"button\">По умолчанию\u003c/button>\u003c/div>\n    \u003cdiv>\u003clabel for=\"background\">Положение фона\u003c/label>\u003cinput id=\"background\" type=\"range\" min=\"-60\" max=\"60\" value=\"0\">\u003cbutton class=\"plain\" id=\"theme\" type=\"button\">Тёмная тема\u003c/button>\u003c/div>\n    \u003cdiv class=\"checks\">\u003clabel>\u003cinput id=\"reduceMotion\" type=\"checkbox\"> Уменьшить движение\u003c/label>\u003clabel>\u003cinput id=\"reduceTransparency\" type=\"checkbox\"> Уменьшить прозрачность\u003c/label>\u003coutput id=\"systemStatus\" class=\"status\" aria-live=\"polite\">\u003c/output>\u003c/div>\n  \u003c/div>\n  \u003csection class=\"flow-experiment\" aria-labelledby=\"flowHeading\">\n    \u003ch2 id=\"flowHeading\">4. Панель → капля → панель\u003c/h2>\n    \u003cp class=\"description\">Стекло собирается в каплю, вытягивает тонкую перемычку и перетекает в другую линзу. Нажми ещё раз во время движения — оно развернётся из текущей формы.\u003c/p>\n    \u003cdiv class=\"scene flow-scene\" id=\"flowScene\">\n      \u003cdiv class=\"backdrop\" aria-hidden=\"true\">\u003c/div>\n      \u003ccanvas class=\"morph-canvas\" id=\"flowCanvas\" aria-hidden=\"true\">\u003c/canvas>\n      \u003cdiv id=\"flowFallback\" aria-hidden=\"true\">\u003cdiv class=\"lg lg-clear flow-fallback\" data-lg-appearance=\"light\">\u003c/div>\u003cdiv class=\"lg lg-clear flow-fallback\" data-lg-appearance=\"light\">\u003c/div>\u003cdiv class=\"lg lg-clear flow-fallback\" data-lg-appearance=\"light\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"flow-content\" id=\"flowLeft\">\u003csmall>На карте\u003c/small>\u003ch3>Набережная\u003c/h3>\u003cp>12 минут пешком · вдоль реки\u003c/p>\u003c/div>\n      \u003cdiv class=\"flow-content\" id=\"flowRight\" aria-hidden=\"true\" inert>\u003csmall>Маршрут выбран\u003c/small>\u003ch3>Набережная\u003c/h3>\u003cp>Можно отправляться на прогулку\u003c/p>\u003c/div>\n      \u003cspan class=\"flow-dock\" id=\"flowLeftDock\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v6m0 8v6M2 12h6m8 0h6\"/>\u003c/svg>\u003c/span>\u003cspan class=\"flow-dock\" id=\"flowRightDock\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M5 19 19 5M5 5h14v14\"/>\u003c/svg>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow-controls\">\u003cbutton class=\"plain\" id=\"flowToggle\" type=\"button\" aria-controls=\"flowScene\">Перелить в линзу\u003c/button>\u003clabel>\u003cinput id=\"flowSlow\" type=\"checkbox\"> Медленнее\u003c/label>\u003coutput id=\"flowStatus\" class=\"status\" aria-live=\"polite\">Панель на карте\u003c/output>\u003c/div>\n    \u003cp class=\"flow-note\" id=\"flowNote\">Общий контур, свет и преломление пересчитываются вместе. Текст остаётся отдельным чётким слоем.\u003c/p>\n  \u003c/section>\n  \u003cdiv class=\"experiments\">\n    \u003carticle>\n      \u003ch2>1. Касание\u003c/h2>\n      \u003cp class=\"description\">Нажми и удерживай кнопку. Свет возникает под касанием, стекло мягко отвечает. Можно пользоваться и клавиатурой.\u003c/p>\n      \u003cdiv class=\"scene\" id=\"pressScene\">\u003cdiv class=\"backdrop\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"pressButton\" class=\"press-button lg-hit-target\" type=\"button\" aria-pressed=\"false\">\u003cspan class=\"lg lg-clear press-material\" data-lg-appearance=\"light\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"press-label\">Добавить в избранное\u003c/span>\u003c/button>\u003c/div>\n      \u003coutput class=\"status\" id=\"pressStatus\" aria-live=\"polite\">Пока не добавлено\u003c/output>\n    \u003c/article>\n    \u003carticle>\n      \u003ch2 id=\"pickerHeading\">2. Выбор\u003c/h2>\n      \u003cp class=\"description\">Нажми или перетащи выбор: линза поднимается, преломляет подписи и значки под собой, затем мягко садится на новый пункт.\u003c/p>\n      \u003cdiv class=\"scene\" id=\"pickerScene\">\u003cdiv class=\"backdrop\" aria-hidden=\"true\">\u003c/div>\u003ccanvas id=\"pickerCanvas\" class=\"picker-canvas\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv class=\"motion-track\" id=\"motionTrack\" role=\"tablist\" aria-label=\"Период прогулок\">\u003cspan id=\"motionIndicator\" class=\"lg lg-clear motion-indicator\" data-lg-appearance=\"light\" aria-hidden=\"true\">\u003c/span>\u003cbutton class=\"motion-tab lg-hit-target\" role=\"tab\" aria-selected=\"true\" aria-controls=\"periodPanel\" id=\"periodDay\">\u003cspan class=\"picker-caption\">\u003csvg class=\"picker-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003c/svg>\u003cspan class=\"picker-label\">День\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"motion-tab lg-hit-target\" role=\"tab\" aria-selected=\"false\" aria-controls=\"periodPanel\" id=\"periodWeek\" tabindex=\"-1\">\u003cspan class=\"picker-caption\">\u003csvg class=\"picker-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 5h14v16H5ZM8 3v4m8-4v4M5 10h14m-10 4h6\"/>\u003c/svg>\u003cspan class=\"picker-label\">Неделя\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"motion-tab lg-hit-target\" role=\"tab\" aria-selected=\"false\" aria-controls=\"periodPanel\" id=\"periodMonth\" tabindex=\"-1\">\u003cspan class=\"picker-caption\">\u003csvg class=\"picker-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 5h14v16H5ZM8 3v4m8-4v4M5 10h14m-10 4h1m4 0h1m-6 3h1m4 0h1\"/>\u003c/svg>\u003cspan class=\"picker-label\">Месяц\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"status\" id=\"periodPanel\" role=\"tabpanel\" aria-labelledby=\"periodDay\">Прогулки на сегодня\u003c/div>\n      \u003cp class=\"picker-note\" id=\"pickerNote\">\u003c/p>\n    \u003c/article>\n    \u003carticle>\n      \u003ch2>3. Раскрытие\u003c/h2>\n      \u003cp class=\"description\">Кнопка становится панелью. Нажми «Свернуть» и сразу раскрой её снова — форма сменит направление.\u003c/p>\n      \u003cdiv class=\"scene\" id=\"morphScene\">\u003cdiv class=\"backdrop\" aria-hidden=\"true\">\u003c/div>\u003ccanvas id=\"morphCanvas\" class=\"morph-canvas\" aria-hidden=\"true\">\u003c/canvas>\u003cdiv id=\"morphFallback\" class=\"lg lg-clear morph-fallback\" data-lg-appearance=\"light\" aria-hidden=\"true\">\u003c/div>\u003cbutton id=\"morphOrigin\" class=\"morph-origin lg-hit-target\" type=\"button\" aria-expanded=\"false\" aria-controls=\"morphPanel\">Маршрут →\u003c/button>\u003cdiv id=\"morphPanel\" class=\"morph-panel\" role=\"region\" aria-label=\"Маршрут прогулки\" hidden inert>\u003cbutton class=\"morph-close lg-hit-target\" id=\"morphClose\" type=\"button\" aria-label=\"Свернуть маршрут\">×\u003c/button>\u003ch3>Набережная\u003c/h3>\u003cp>12 минут пешком · вдоль реки\u003c/p>\u003cbutton class=\"start lg-hit-target\" id=\"startWalk\" type=\"button\">Начать прогулку\u003c/button>\u003c/div>\u003c/div>\n      \u003cbutton class=\"plain\" id=\"morphToggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"morphPanel\">Раскрыть панель\u003c/button>\n      \u003coutput class=\"status\" id=\"morphStatus\" aria-live=\"polite\">Выбери маршрут\u003c/output>\n    \u003c/article>\n  \u003c/div>\n  \u003cp class=\"explanation\">\u003cspan id=\"renderingNote\">В выборе и раскрытии используется собственный нарисованный фон: форма и линза пересчитываются вместе, без захвата DOM.\u003c/span> Это веб-приближение, а не интерфейс Apple. \u003ca href=\"optics.html\">Отдельно сравнить прозрачность, blur и линзу →\u003c/a>\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(() => {\n\"use strict\";\nconst __definitions = {\n\"liquid-glass.js\": function(__exports, __load) {\n\"use strict\";\n/*\n * Liquid Glass — reference runtime for the web (ES module, zero dependencies).\n *\n *   import { initLiquidGlass } from './liquid-glass.js';\n *   initLiquidGlass();          // detects the tier, enhances .lg-lens / .lg-interactive / [data-lg-adaptive]\n *\n * Tiers (html[data-lg-tier]):\n *   0 solid      — no transparency (Reduce Transparency, forced colors, no backdrop-filter)\n *   1 frosted    — blur + saturation + tint + rim (default CSS; Safari, Firefox, weak devices)\n *   2 lens       — + edge refraction through an SVG displacement map (Chromium only)\n *   3 liquid     — + WebGL shader glass (opt-in, see liquid-glass-webgl.js)\n *\n * Every animation is a spring (see docs/05-motion.md). Motion is transform/opacity only.\n */\n\n// ---------------------------------------------------------------------------\n// Motion tokens (response in seconds, SwiftUI semantics). Keep in sync with tokens/.\n// ---------------------------------------------------------------------------\n\nconst MOTION = {\n  interactive: { response: 0.15, dampingRatio: 0.86 },\n  press: { response: 0.22, dampingRatio: 0.65 },\n  release: { response: 0.38, dampingRatio: 0.55 },\n  snappy: { response: 0.3, dampingRatio: 0.85 },\n  morph: { response: 0.42, dampingRatio: 0.78 },\n  bouncy: { response: 0.5, dampingRatio: 0.7 },\n  smooth: { response: 0.5, dampingRatio: 1 },\n  // selection indicator: the leading edge runs ahead, the trailing edge catches up\n  lead: { response: 0.24, dampingRatio: 0.8 },\n  trail: { response: 0.42, dampingRatio: 0.74 },\n  dismiss: { response: 0.28, dampingRatio: 1 },\n};\n\nconst hasWindow = typeof window !== 'undefined';\nconst mq = (q) => hasWindow && typeof matchMedia === 'function' && matchMedia(q).matches;\n\nconst prefersReducedMotion = () => mq('(prefers-reduced-motion: reduce)');\nconst clamp = (v, lo, hi) => M content { transform-origin: 0 0; }\n.lg-menu__item {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  height: 40px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: max(var(--lg-radius-lg) - 6px, 6px); /* concentric with the menu */\n  background: none;\n  color: inherit;\n  font: 500 15px/1 var(--lg-font);\n  text-align: left;\n  cursor: pointer;\n}\n.lg-menu__item:hover,\n.lg-menu__item:focus-visible { background: var(--lgv-hover); outline: 0; }\n.lg-menu__sep { height: 1px; margin: 6px 12px; background: var(--lgv-label-2); opacity: 0.25; }\n\n/* Sheet: inset floating glass at partial height, attaches to the edges when expanded. */\n.lg-sheet {\n  --lg-radius: var(--lg-radius-2xl);\n  position: fixed;\n  left: 8px;\n  right: 8px;\n  bottom: 8px;\n  padding: 20px;\n  transition:\n    inset var(--lg-dur-smooth) var(--lg-ease-smooth),\n    border-radius var(--lg-dur-smooth) var(--lg-ease-smooth),\n    background-color 0.3s ease;\n}\n.lg-sheet[data-detent=\"large\"] {\n  --lg-fill: var(--lgv-solid);\n  left: 0;\n  right: 0;\n  bottom: 0;\n  border-bottom-left-radius: 0;\n  border-bottom-right-radius: 0;\n}\n\n/* Scroll edge effect: content softly dissolves under floating bars (no hard divider). */\n.lg-scroll-edge {\n  position: fixed;\n  left: 0;\n  right: 0;\n  z-index: 9;\n  height: var(--lg-edge-height, 96px);\n  pointer-events: none;\n  -webkit-backdrop-filter: blur(6px);\n  backdrop-filter: blur(6px);\n}\n.lg-scroll-edge--top {\n  top: 0;\n  background: linear-gradient(to bottom, rgb(var(--lgv-canvas) / 0.55), rgb(var(--lgv-canvas) / 0));\n  -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent);\n  mask-image: linear-gradient(to bottom, #000 35%, transparent);\n}\n.lg-scroll-edge--bottom {\n  bottom: 0;\n  background: linear-gradient(to top, rgb(var(--lgv-canvas) / 0.55), rgb(var(--lgv-canvas) / 0));\n  -webkit-mask-image: linear-gradient(to top, #000 35%, transparent);\n  mask-image: linear-gradient(to top, #000 35%, transparent);\n}\nhtml[data-lg-tier=\"0\"] .lg-scroll-edge,\nhtml[data-lg-tier=\"1\"] .lg-scroll-edge--bottom {\n  /* weak devices: keep only the gradient, drop the blur */\n  -webkit-backdrop-filter: none;\n  backdrop-filter: none;\n}\n\n.lg-label-2 { color: var(--lgv-label-2); }\n\n/* Use on semantic hit targets whose feedback is painted by glass/canvas.\n * Keep native input behaviour and :focus-visible; only remove the rectangular\n * WebKit/Chromium touch overlay over the independently rendered shape. */\n.lg-hit-target { -webkit-tap-highlight-color: transparent; }\n\n\u003c/style>\n  \u003cstyle>\n    * { box-sizing: border-box; }\n    body { margin: 0; background: #f7f8fa; color: #172332; font: 16px/1.5 system-ui, sans-serif; }\n    main { max-width: 1220px; margin: auto; padding: 36px 24px 48px; }\n    a { color: inherit; }\n    nav { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; }\n    h1 { max-width: 800px; font-size: clamp(32px, 5vw, 52px); line-height: 1.08; letter-spacing: -.045em; margin: 20px 0 16px; }\n    h2 { margin: 0 0 8px; font-size: 21px; letter-spacing: -.025em; }\n    p { margin: 0; }\n    .intro { max-width: 760px; color: #536273; }\n    button, input { font: inherit; }\n    button { cursor: pointer; }\n    button:focus-visible, input:focus-visible { outline: 3px solid #1473e6; outline-offset: 5px; }\n    .settings { margin: 28px 0 36px; padding: 18px 22px; border: 1px solid #dbe1e8; background: white; border-radius: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 30px; align-items: center; }\n    .settings label { display: block; }\n    .settings input[type=\"range\"] { width: 100%; margin: 12px 0 0; accent-color: #2375ce; }\n    .settings input[type=\"checkbox\"] { width: 18px; height: 18px; vertical-align: middle; }\n    .ends { display: flex; justify-content: space-between; color: #617286; font-size: 12px; }\n    .checks { display: grid; gap: 10px; }\n    .plain { min-height: 44px; padding: 8px 16px; border: 1px solid #aab7c7; border-radius: 14px; background: white; color: #172332; }\n    .experiments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }\n    article { min-width: 0; }\n    .description { min-height: 88px; color: #536273; font-size: 14px; }\n    .control-scene { position: relative; height: 280px; margin: 16px 0; border-radius: 26px; overflow: hidden; background: #f0f2f5; color: #152536; }\n    .control-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }\n    .control-fallback { position: absolute; inset: 0; pointer-events: none; }\n    .control-shape { position: absolute; background: #fff; border: 1px solid #c4cbd4; box-shadow: 0 3px 8px rgb(20 30 45 / .06); }\n    .status { display: block; margin-top: 12px; min-height: 24px; font-size: 14px; color: #536273; }\n    .control-label { position: absolute; top: 44px; left: 32px; right: 32px; display: flex; justify-content: space-between; font-weight: 650; gap: 12px; }\n    .volume { position: absolute; left: 32px; top: 116px; width: calc(100% - 64px); height: 64px; padding: 0; margin: 0; border: 0; border-radius: 20px; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; touch-action: pan-y; }\n    .volume::-webkit-slider-runnable-track { height: 6px; background: transparent; }\n    .volume::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border: 0; border-radius: 50%; background: transparent; }\n    .volume::-moz-range-track { height: 6px; background: transparent; }\n    .volume::-moz-range-progress { background: transparent; }\n    .volume::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; }\n    .volume-line { position: absolute; left: 46px; right: 46px; top: 145px; height: 6px; background: #d6d9de; border-radius: 3px; overflow: hidden; pointer-events: none; }\n    .volume-line span { display: block; width: 58%; height: 100%; background: #087fe8; }\n    .glass-toggle { position: absolute; left: calc(50% - 52px); top: 116px; width: 104px; height: 64px; border: 0; border-radius: 32px; background: none; touch-action: pan-y; }\n    .toggle-track { position: absolute; top: 124px; left: calc(50% - 48px); width: 96px; height: 48px; background: #d6d9de; border-radius: 24px; pointer-events: none; }\n    .toggle-track.on { background: #087fe8; }\n    .split-origin { position: absolute; left: calc(50% - 78px); top: 120px; width: 156px; height: 56px; border: 0; border-radius: 28px; background: none; color: #152536; font-weight: 650; }\n    .split-actions { position: absolute; inset: 0; pointer-events: none; }\n    .split-action { position: absolute; top: 120px; width: 56px; height: 56px; border: 0; border-radius: 28px; background: none; color: #152536; font-weight: 650; pointer-events: auto; }\n    .split-action svg { width: 24px; height: 24px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }\n    .split-action[aria-pressed=\"true\"] { color: #0766b5; }\n    #splitStar { left: calc(50% - 124px); }\n    #splitSave { left: calc(50% - 52px); }\n    #splitDone { left: calc(50% + 20px); width: 104px; }\n    [hidden] { display: none !important; }\n    .note { margin-top: 32px; max-width: 900px; color: #536273; font-size: 13px; }\n    html[data-theme=\"dark\"] body { background: #111923; color: #edf2f8; }\n    html[data-theme=\"dark\"] .settings { background: #1c2836; border-color: #425166; }\n    html[data-theme=\"dark\"] .intro, html[data-theme=\"dark\"] .description, html[data-theme=\"dark\"] .status, html[data-theme=\"dark\"] .note, html[data-theme=\"dark\"] .ends { color: #b7c5d5; }\n    @media (max-width: 860px) { .experiments { grid-template-columns: 1fr; } .control-scene { max-width: 560px; } .description { min-height: 0; } }\n    @media (max-width: 480px) { main { padding: 24px 16px 40px; } .settings { grid-template-columns: 1fr; padding: 16px; } }\n    @media (forced-colors: active) { .control-scene, .control-shape { background: Canvas; color: CanvasText; } .control-shape { border-color: CanvasText; box-shadow: none; } .control-label, .split-origin, .split-action { color: CanvasText; } .toggle-track.on, .volume-line span { background: Highlight; } .toggle-track, .volume-line { border: 1px solid CanvasText; } .glass-toggle[aria-checked=\"true\"] { outline: 2px solid Highlight; } .split-action[aria-pressed=\"true\"] { outline: 2px solid Highlight; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cnav>\u003ca href=\"motion.html\">← Все анимации\u003c/a>\u003ca href=\"optics.html\">Сравнение оптики\u003c/a>\u003c/nav>\n  \u003ch1>Подложка становится линзой.\u003c/h1>\n  \u003cp class=\"intro\">Удерживай и перетаскивай. Спокойные элементы оживают на время действия, затем возвращаются в обычный вид. Движение можно прервать.\u003c/p>\n  \u003cdiv class=\"settings\" aria-label=\"Внешний вид\">\n    \u003cdiv>\u003clabel for=\"controlDensity\">Liquid Glass \u003coutput id=\"densityValue\" for=\"controlDensity\">\u003c/output>\u003c/label>\u003cinput id=\"controlDensity\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\u003cdiv class=\"ends\">\u003cspan>Прозрачный\u003c/span>\u003cspan>Плотный\u003c/span>\u003c/div>\u003cbutton class=\"plain\" id=\"densityReset\" type=\"button\">По умолчанию\u003c/button>\u003c/div>\n    \u003cdiv class=\"checks\">\u003clabel>\u003cinput id=\"testBackdrop\" type=\"checkbox\"> Тестовый фон\u003c/label>\u003clabel>\u003cinput id=\"reduceMotion\" type=\"checkbox\"> Уменьшить движение\u003c/label>\u003clabel>\u003cinput id=\"reduceTransparency\" type=\"checkbox\"> Уменьшить прозрачность\u003c/label>\u003cbutton class=\"plain\" id=\"theme\" type=\"button\">Тёмная тема\u003c/button>\u003coutput id=\"systemStatus\" class=\"status\" aria-live=\"polite\">\u003c/output>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"experiments\">\n    \u003carticle>\n      \u003ch2>1. Ползунок с каплей\u003c/h2>\n      \u003cp class=\"description\">Обычный белый бегунок поднимается в прозрачную линзу. Веди его в обе стороны и отпускай. Работают и стрелки клавиатуры.\u003c/p>\n      \u003cdiv class=\"control-scene\" id=\"volumeScene\">\n        \u003cdiv class=\"volume-line\" aria-hidden=\"true\">\u003cspan id=\"volumeFill\">\u003c/span>\u003c/div>\n        \u003ccanvas id=\"volumeCanvas\" class=\"control-canvas\" aria-hidden=\"true\">\u003c/canvas>\n        \u003cdiv id=\"volumeFallback\" class=\"control-fallback\" aria-hidden=\"true\">\u003cdiv class=\"control-shape\">\u003c/div>\u003c/div>\n        \u003clabel class=\"control-label\" for=\"volume\">\u003cspan>Громкость\u003c/span>\u003coutput id=\"volumeValue\" for=\"volume\">58%\u003c/output>\u003c/label>\n        \u003cinput id=\"volume\" class=\"volume lg-hit-target\" aria-label=\"Громкость\" type=\"range\" min=\"0\" max=\"100\" value=\"58\">\n      \u003c/div>\n      \u003cp class=\"status\" id=\"volumeStatus\">Потяни за бегунок\u003c/p>\n    \u003c/article>\n    \u003carticle>\n      \u003ch2>2. Живой переключатель\u003c/h2>\n      \u003cp class=\"description\">Нажми или перетащи. Подложка становится объёмной и пропускает дорожку сквозь себя, затем снова успокаивается.\u003c/p>\n      \u003cdiv class=\"control-scene\" id=\"toggleScene\">\n        \u003cdiv id=\"toggleTrack\" class=\"toggle-track\" aria-hidden=\"true\">\u003c/div>\n        \u003ccanvas id=\"toggleCanvas\" class=\"control-canvas\" aria-hidden=\"true\">\u003c/canvas>\n        \u003cdiv id=\"toggleFallback\" class=\"control-fallback\" aria-hidden=\"true\">\u003cdiv class=\"control-shape\">\u003c/div>\u003c/div>\n        \u003cspan class=\"control-label\" id=\"toggleLabel\">Пространственный звук\u003c/span>\n        \u003cbutton id=\"glassToggle\" class=\"glass-toggle lg-hit-target\" type=\"button\" role=\"switch\" aria-checked=\"false\" aria-labelledby=\"toggleLabel\">\u003c/button>\n      \u003c/div>\n      \u003coutput class=\"status\" id=\"toggleStatus\" aria-live=\"polite\">Выключен\u003c/output>\n    \u003c/article>\n    \u003carticle>\n      \u003ch2>3. Одна кнопка → группа\u003c/h2>\n      \u003cp class=\"description\">Общая поверхность вытягивается и разделяется на действия. Нажми «Свернуть» ещё до конца — формы снова сольются.\u003c/p>\n      \u003cdiv class=\"control-scene\" id=\"splitScene\">\n        \u003ccanvas id=\"splitCanvas\" class=\"control-canvas\" aria-hidden=\"true\">\u003c/canvas>\n        \u003cdiv id=\"splitFallback\" class=\"control-fallback\" aria-hidden=\"true\">\u003cdiv class=\"control-shape\">\u003c/div>\u003cdiv class=\"control-shape\">\u003c/div>\u003cdiv class=\"control-shape\">\u003c/div>\u003c/div>\n        \u003cbutton id=\"splitOrigin\" class=\"split-origin lg-hit-target\" type=\"button\" aria-expanded=\"false\" aria-controls=\"splitActions\">Выбрать\u003c/button>\n        \u003cdiv id=\"splitActions\" class=\"split-actions\" role=\"group\" aria-label=\"Действия с выбором\" hidden inert>\n          \u003cbutton id=\"splitStar\" class=\"split-action lg-hit-target\" type=\"button\" aria-label=\"В избранное\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z\"/>\u003c/svg>\u003c/button>\n          \u003cbutton id=\"splitSave\" class=\"split-action lg-hit-target\" type=\"button\" aria-label=\"Сохранить\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 4h12v17l-6-4-6 4Z\"/>\u003c/svg>\u003c/button>\n          \u003cbutton id=\"splitDone\" class=\"split-action lg-hit-target\" type=\"button\">Готово\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"plain\" id=\"splitToggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"splitActions\">Раскрыть действия\u003c/button>\n      \u003coutput class=\"status\" id=\"splitStatus\" aria-live=\"polite\">Действия свёрнуты\u003c/output>\n    \u003c/article>\n  \u003c/div>\n  \u003cp class=\"note\">\u003cspan id=\"renderNote\">Форма и преломление пересчитываются вместе над собственной нарисованной сценой.\u003c/span> Это веб-приближение по просмотренным фрагментам Apple: \u003ca href=\"https://developer.apple.com/videos/play/wwdc2026/269/?time=154\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Источник откроется в новой вкладке\">controls WWDC26\u003c/a> и \u003ca href=\"https://developer.apple.com/videos/play/wwdc2025/219/?time=300\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Источник откроется в новой вкладке\">разделение форм WWDC25\u003c/a>.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(() => {\n\"use strict\";\nconst __definitions = {\n\"liquid-glass.js\": function(__exports, __load) {\n\"use strict\";\n/*\n * Liquid Glass — reference runtime for the web (ES module, zero dependencies).\n *\n *   import { initLiquidGlass } from './liquid-glass.js';\n *   initLiquidGlass();          // detects the tier, enhances .lg-lens / .lg-interactive / [data-lg-adaptive]\n *\n * Tiers (html[data-lg-tier]):\n *   0 solid      — no transparency (Reduce Transparency, forced colors, no backdrop-filter)\n *   1 frosted    — blur + saturation + tint + rim (default CSS; Safari, Firefox, weak devices)\n *   2 lens       — + edge refraction through an SVG displacement map (Chromium only)\n *   3 liquid     — + WebGL shader glass (opt-in, see liquid-glass-webgl.js)\n *\n * Every animation is a spring (see docs/05-motion.md). Motion is transform/opacity only.\n */\n\n// ---------------------------------------------------------------------------\n// Motion tokens (response in seconds, SwiftUI semantics). Keep in sync with tokens/.\n// ---------------------------------------------------------------------------\n\nconst MOTION = {\n  interactive: { response: 0.15, dampingRatio: 0.86 },\n  press: { response: 0.22, dampingRatio: 0.65 },\n
