r: var(--secondary); font-size: 12px; }\n    .chevron { width: 16px !important; color: var(--secondary); }\n    :root[data-icon-mode=\"monochrome\"] .category-icon { background: var(--muted-icon); color: var(--ink); }\n    .detail { padding: 24px; border-radius: 24px; border: 1px solid var(--line); background: var(--paper); }\n    .detail .eyebrow { color: var(--secondary); font-size: 13px; margin-bottom: 8px; }\n    .detail p { color: var(--secondary); }\n    .roles { display: grid; gap: 20px; margin-top: 24px; }\n    .role { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }\n    .role .icon { margin-top: 2px; }\n    .role strong { display: block; margin-bottom: 3px; }\n    .warning { color: var(--warning); }\n    .reset { color: var(--danger); display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; }\n    .empty { padding: 18px; color: var(--secondary); }\n    .note { max-width: 840px; margin-top: 28px; color: var(--secondary); font-size: 13px; }\n    [hidden] { display: none !important; }\n    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }\n    @media (max-width: 480px) { main { padding: 24px 16px 36px; } .settings { grid-template-columns: 1fr; padding: 16px; } .scene { padding: 12px; } .detail { padding: 20px; } .setting-row { padding: 13px 12px; } }\n    @media (forced-colors: active) { .scene, .group, .settings, .detail { background: Canvas; border-color: CanvasText; } .category-icon { forced-color-adjust: auto; background: Canvas; color: CanvasText; border: 1px solid CanvasText; } .setting-row[aria-pressed=\"true\"] { outline: 2px solid Highlight; outline-offset: -3px; } .warning, .reset { color: CanvasText; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute\">\u003cdefs>\n  \u003csymbol id=\"wifi\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 8a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0M9 16a4.5 4.5 0 0 1 6 0\"/>\u003ccircle cx=\"12\" cy=\"20\" r=\".7\" fill=\"currentColor\" stroke=\"none\"/>\u003c/symbol>\n  \u003csymbol id=\"bluetooth\" viewBox=\"0 0 24 24\">\u003cpath d=\"m6 6 12 12-6 4V2l6 4L6 18\"/>\u003c/symbol>\n  \u003csymbol id=\"bell\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 17h14l-2-4V9a5 5 0 0 0-10 0v4l-2 4ZM10 21h4M12 2v2\"/>\u003c/symbol>\n  \u003csymbol id=\"sound\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 9h4l5-4v14l-5-4H4ZM17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14\"/>\u003c/symbol>\n  \u003csymbol id=\"sun\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5\"/>\u003c/symbol>\n  \u003csymbol id=\"lock\" viewBox=\"0 0 24 24\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M8 10V7a4 4 0 0 1 8 0v3M12 14v3\"/>\u003c/symbol>\n  \u003csymbol id=\"search\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/>\u003cpath d=\"m16 16 5 5\"/>\u003c/symbol>\n  \u003csymbol id=\"info\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6M12 7v.1\"/>\u003c/symbol>\n  \u003csymbol id=\"chevron\" viewBox=\"0 0 24 24\">\u003cpath d=\"m9 5 7 7-7 7\"/>\u003c/symbol>\n  \u003csymbol id=\"warning\" viewBox=\"0 0 24 24\">\u003cpath d=\"m12 3 10 18H2L12 3ZM12 9v5m0 3v.1\"/>\u003c/symbol>\n  \u003csymbol id=\"reset\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 10a8 8 0 1 1 1 8M4 4v6h6\"/>\u003c/symbol>\n\u003c/defs>\u003c/svg>\n\u003cmain>\n  \u003cnav>\u003ca href=\"demo.html\">Компоненты\u003c/a>\u003ca href=\"motion.html\">Движение\u003c/a>\u003ca href=\"controls.html\">Живые элементы\u003c/a>\u003c/nav>\n  \u003ch1>Цвет помогает найти нужное.\u003c/h1>\n  \u003cp class=\"intro\">У категорий — свой цвет. У поиска и команд — спокойные однотонные символы. Предупреждения сохраняют смысл в любом оформлении.\u003c/p>\n  \u003cdiv class=\"settings\" aria-label=\"Внешний вид примера\">\n    \u003cdiv>\u003clabel for=\"iconMode\">Значки категорий\u003c/label>\u003cselect class=\"plain\" id=\"iconMode\">\u003coption value=\"purpose\">Цветные\u003c/option>\u003coption value=\"monochrome\">Монохромные\u003c/option>\u003c/select>\u003cp class=\"help\">Выбор относится к категориям. Значки действий и цвета состояний не меняются.\u003c/p>\u003c/div>\n    \u003cdiv>\u003clabel for=\"iconDensity\">Liquid Glass \u003coutput id=\"densityValue\" for=\"iconDensity\">\u003c/output>\u003c/label>\u003cinput id=\"iconDensity\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\u003cdiv class=\"ends\">\u003cspan>Прозрачный\u003c/span>\u003cspan>Плотный\u003c/span>\u003c/div>\u003cdiv class=\"theme-row\">\u003cbutton class=\"plain\" id=\"densityReset\" type=\"button\">По умолчанию\u003c/button>\u003cbutton class=\"plain\" id=\"theme\" type=\"button\">Тёмная тема\u003c/button>\u003c/div>\u003cp class=\"help\" id=\"materialStatus\" aria-live=\"polite\">\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"layout\">\n    \u003csection class=\"scene\" aria-label=\"Пример настроек\">\n      \u003cdiv class=\"scene-toolbar lg lg-clear lg-lens\" role=\"toolbar\" aria-label=\"Действия примера\">\n        \u003cspan class=\"toolbar-title\">Настройки\u003c/span>\n        \u003cbutton class=\"tool\" id=\"searchButton\" type=\"button\" aria-label=\"Поиск настроек\" aria-expanded=\"false\" aria-controls=\"filter\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#search\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"tool\" id=\"detailButton\" type=\"button\" aria-label=\"Показать описания категорий\" aria-pressed=\"false\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#info\"/>\u003c/svg>\u003c/button>\n      \u003c/div>\n      \u003cinput class=\"plain filter\" id=\"filter\" type=\"search\" placeholder=\"Найти категорию\" aria-label=\"Найти категорию\" hidden>\n      \u003cdiv class=\"group\" id=\"categories\" role=\"group\" aria-label=\"Категории настроек\">\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Wi-Fi\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#1768c4\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#wifi\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Wi-Fi\u003c/span>\u003cspan class=\"row-description\" hidden>Сети и подключение\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Bluetooth\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#1768c4\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#bluetooth\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Bluetooth\u003c/span>\u003cspan class=\"row-description\" hidden>Наушники и другие устройства\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Уведомления\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#c12c45\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#bell\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Уведомления\u003c/span>\u003cspan class=\"row-description\" hidden>Сигналы и разрешения\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Звук\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#a85200\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#sound\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Звук\u003c/span>\u003cspan class=\"row-description\" hidden>Громкость и отклики\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Экран\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#6e57c3\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#sun\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Экран\u003c/span>\u003cspan class=\"row-description\" hidden>Яркость и оформление\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cbutton class=\"setting-row\" type=\"button\" data-category=\"Приватность\" aria-pressed=\"false\">\u003cspan class=\"category-icon\" style=\"--category:#16716a\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#lock\"/>\u003c/svg>\u003c/span>\u003cspan class=\"row-copy\">\u003cspan class=\"row-label\">Приватность\u003c/span>\u003cspan class=\"row-description\" hidden>Доступ к личным данным\u003c/span>\u003c/span>\u003csvg class=\"icon chevron\" aria-hidden=\"true\">\u003cuse href=\"#chevron\"/>\u003c/svg>\u003c/button>\n        \u003cp class=\"empty\" id=\"empty\" hidden>Ничего не найдено\u003c/p>\n      \u003c/div>\n    \u003c/section>\n    \u003caside class=\"detail\" aria-label=\"Роль цвета\">\n      \u003cp class=\"eyebrow\">Можно нажимать на строки\u003c/p>\n      \u003ch2 id=\"selection\" aria-live=\"polite\">Выбери категорию\u003c/h2>\n      \u003cp>Это демонстрация оформления. Она не меняет настройки устройства.\u003c/p>\n      \u003cdiv class=\"roles\">\n        \u003cdiv class=\"role\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#search\"/>\u003c/svg>\u003cdiv>\u003cstrong>Действие\u003c/strong>\u003cp>Нейтральный символ не спорит с содержимым. Акцент появляется у выбранного или главного действия.\u003c/p>\u003c/div>\u003c/div>\n        \u003cdiv class=\"role warning\" id=\"warningExample\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#warning\"/>\u003c/svg>\u003cdiv>\u003cstrong>Предупреждение\u003c/strong>\u003cp>Важное состояние обозначается цветом, формой и текстом. Режим значков его не скрывает.\u003c/p>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"plain reset\" id=\"resetExample\" type=\"button\">\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#reset\"/>\u003c/svg>Сбросить пример\u003c/button>\n    \u003c/aside>\n  \u003c/div>\n  \u003cp class=\"note\">Пример следует подходу Apple к роли цвета, а не копирует точные системные значки или палитру. В боковой навигации обычно уместен accent приложения или пользователя; разноцветные категории не нужно автоматически переносить в каждый sidebar. \u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/color\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Источник откроется в новой вкладке\">Apple HIG: Color\u003c/a> · \u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/sf-symbols\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Источник откроется в новой вкладке\">SF Symbols\u003c/a> · \u003ca href=\"https://developer.apple.com/design/human-interface-guidelines/sidebars\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Источник откроется в новой вкладке\">Sidebars\u003c/a>.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(() => {\n\"use strict\";\nconst __definitions = {\n\"liquid-glass.js\": function(__exports, __load) {\n\"use strict\";\n/*\n * Liquid Glass — reference runtime for the web (ES module, zero dependencies).\n *\n *   import { initLiquidGlass } from './liquid-glass.js';\n *   initLiquidGlass();          // detects the tier, enhances .lg-lens / .lg-interactive / [data-lg-adaptive]\n *\n * Tiers (html[data-lg-tier]):\n *   0 solid      — no transparency (Reduce Transparency, forced colors,
